<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-title" content="WebClip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>WebClip 記事保存</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --line:#d9dee6; --line2:#eceff4; --text:#1d2430; --sub:#5d6b7e;
  --accent:#2563eb; --accent2:#dbe7ff; --ok:#15803d; --okbg:#e3f5e8; --ng:#c62828; --ngbg:#fde7e7; --warn:#b45309; --warnbg:#fff3dc;
  --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#b6c0ce;background:#f8fafc}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1d4fd0}
button.danger{color:var(--ng)}
button.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8f5;outline-offset:-1px}
a{color:var(--accent)}

.appbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1f2937;color:#e5e7eb}
.appbar .brand b{font-size:16px;letter-spacing:.5px;color:#fff}
.appbar .brand span{margin-left:6px;font-size:11px;color:#9ca3af}
.appbar .actions{margin-left:auto;display:flex;gap:6px;overflow-x:auto;min-width:0}
.appbar .lblS{display:none}
.appbar button{background:#374151;border-color:#4b5563;color:#e5e7eb}
.appbar button:hover{background:#4b5563}
.appbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.appbar .back{display:none}

#layout{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100% - 48px)}
.pane{background:var(--panel);overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
#listPane{border-right:1px solid var(--line)}
#readerPane{background:var(--bg)}

.listTools{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.listTools .row{display:flex;gap:6px}
.count{font-size:12px;color:var(--sub)}
#list{list-style:none;margin:0;padding:0}
#list li{position:relative;padding:10px 42px 10px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
#list li:hover{background:#f8fafc}
#list li.on{background:var(--accent2)}
#list .t{font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#list .m{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .tg{margin-top:3px}
#list .ext{position:absolute;right:8px;top:10px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:#fff;font-size:14px}
.kind{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:#eef2f7;color:#475569;margin-right:4px;vertical-align:1px}
.kind.link{background:var(--warnbg);color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:#e8f0fe;color:#1e4fb8;margin:0 4px 2px 0;cursor:pointer}
#list.dragMode li{padding-left:34px}
#list .handle{position:absolute;left:0;top:0;bottom:0;width:30px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:15px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#list li.divider{background:#eef2f7;color:#334155;font-weight:700;font-size:13px;padding-top:7px;padding-bottom:7px;border-top:2px solid #cbd5e1;cursor:pointer;min-height:34px}
#list li.divider .dvT{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li.ph{background:var(--accent2);border:2px dashed #9db8f5;padding:0}
#list li.dragging{background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:.95;cursor:grabbing}
.listTools .row select{flex:1}
.tagEd .tagSel{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:22px;align-items:center}
.tagChip{display:inline-flex;align-items:center;background:#e8f0fe;color:#1e4fb8;border-radius:12px;padding:1px 2px 1px 9px;font-size:12px}
.tagChip button{border:none;background:transparent;padding:0 6px;color:#1e4fb8;font-size:15px;line-height:1.2}
.tagSug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-height:132px;overflow:auto}
.tagOpt{padding:3px 10px;font-size:12px;border-radius:12px}
.tagOpt small{color:var(--sub);margin-left:2px}
.tagOpt.new{border-color:#9db8f5;color:var(--accent)}
.rd .tagRow{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.rd .tagRow button{margin-left:4px}
.tagTbl{width:100%;border-collapse:collapse;font-size:13px}
.tagTbl td{padding:6px 4px;border-bottom:1px solid var(--line2)}
.tagTbl td.n{color:var(--sub);white-space:nowrap;width:4em}
.tagTbl td.b{text-align:right;white-space:nowrap}
.tagTbl td.b button{margin-left:4px}
.tagTbl td.tn{word-break:break-all}
.emptyMsg{padding:24px 16px;color:var(--sub);line-height:1.7;font-size:13px}

.rd{max-width:800px;margin:0 auto;padding:18px 18px 80px;background:var(--panel);min-height:100%}
.rd .kindRow{font-size:12px;color:var(--sub)}
.rd h1.ttl{font-size:1.45em;line-height:1.4;margin:6px 0 6px;word-break:break-word}
.rd .metaRow{font-size:12px;color:var(--sub)}
.rd .linkRow{margin:8px 0;padding:8px 10px;background:#f6f8fb;border:1px solid var(--line2);border-radius:8px;font-size:13px;word-break:break-all}
.rd .linkRow .lbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rd .actRow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rd .memo{white-space:pre-wrap;background:var(--warnbg);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;line-height:1.6}
.rd .fsRow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin:10px 0 0;justify-content:flex-end}
.rd hr.sep{border:none;border-top:1px solid var(--line);margin:10px 0 16px}
.rd .body{font-size:var(--fs);line-height:1.85;overflow-wrap:anywhere}
.body img{max-width:100%;height:auto}
.body pre{overflow:auto;background:#f6f8fa;padding:10px;border-radius:6px;font-size:.85em;line-height:1.5}
.body code{background:#f1f3f6;padding:0 3px;border-radius:3px;font-size:.9em}
.body pre code{background:none;padding:0}
.body table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:.9em}
.body td,.body th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.body blockquote{border-left:3px solid #cbd5e1;margin:1em 0;padding:0 1em;color:#475569}
.body figure{margin:1em 0}
.body h1{font-size:1.4em;line-height:1.4}.body h2{font-size:1.25em;line-height:1.45}.body h3{font-size:1.1em}.body h4,.body h5,.body h6{font-size:1em}
.body figcaption{font-size:.85em;color:var(--sub)}
.linkOnly{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--sub);line-height:1.7}
.welcome{max-width:640px;margin:0 auto;padding:30px 20px;line-height:1.8;color:#334155}
.welcome h2{font-size:18px;margin:0 0 10px}
.welcome ol{padding-left:1.3em}

.modalWrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:12px;overflow:auto}
.modalWrap[hidden]{display:none}
.modal{background:#fff;border-radius:10px;width:100%;max-width:760px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin:auto 0}
.modal h2{font-size:16px;margin:0 0 8px}
.modal h3{font-size:13px;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line2);color:#334155}
.modalBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
#dlgWrap{z-index:60}
#dlgWrap .modal{max-width:440px;margin-top:20vh}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:4px 0}
.fld{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.fld>span{font-size:12px;color:var(--sub)}
.fldRow{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.warnBox{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:12px;margin:6px 0}
.infoBox{background:#f6f8fb;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:12px;color:#475569;margin:6px 0}
.pvBody{border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:40vh;overflow:auto;font-size:14px;line-height:1.75;overflow-wrap:anywhere}
#pasteBox{min-height:72px;font-size:13px}
.bmLink{display:inline-block;padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;cursor:grab}
.steps{margin:4px 0 0;padding-left:1.3em;line-height:1.7;font-size:13px}
.kv{font-size:13px;line-height:1.8}
.kv b{display:inline-block;min-width:8em;font-weight:normal;color:var(--sub)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

@media (max-width:899px){
  #layout{grid-template-columns:1fr}
  #listPane{border-right:none}
  #readerPane{display:none}
  body.reading #listPane{display:none}
  body.reading #readerPane{display:block}
  body.reading .appbar .back{display:inline-block}
  body.reading .appbar .brand{display:none}
  .rd{padding:14px 14px 80px}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:599px){
  .appbar .brand span{display:none}
  .appbar .lblL{display:none}
  .appbar .lblS{display:inline}
}
</style>
</head>
<body>
<header class="appbar">
  <button id="btnBack" class="back">‹ 一覧</button>
  <div class="brand"><b>WebClip</b><span id="ver"></span></div>
  <div class="actions">
    <button id="btnImport" class="primary">＋ 取込</button>
    <button id="btnBm" title="ブックマークレット"><span class="lblL">ブックマークレット</span><span class="lblS">BM登録</span></button>
    <button id="btnBackup">バックアップ</button>
  </div>
</header>
<div id="layout">
  <section id="listPane" class="pane">
    <div class="listTools">
      <input id="q" type="search" placeholder="検索（タイトル・本文・URL・メモ／#タグ）">
      <div class="row">
        <select id="fSite"><option value="">すべてのサイト</option></select>
        <select id="fTag"><option value="">すべてのタグ</option></select>
      </div>
      <div class="row">
        <select id="fSort">
          <option value="new">保存日（新しい順）</option>
          <option value="old">保存日（古い順）</option>
          <option value="title">タイトル順</option>
          <option value="site">サイト順</option>
          <option value="manual">手動（並べ替え・仕切り）</option>
        </select>
        <button id="btnDivider" class="sm" hidden>＋ 仕切り</button>
        <button id="btnTags" class="sm">タグ管理</button>
      </div>
      <div class="count" id="count"></div>
    </div>
    <ul id="list"></ul>
    <div id="empty" class="emptyMsg" hidden></div>
  </section>
  <section id="readerPane" class="pane"><div id="reader"></div></section>
</div>
<div id="modalWrap" class="modalWrap" hidden><div class="modal" id="modal"></div></div>
<div id="dlgWrap" class="modalWrap" hidden><div class="modal" id="dlg"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
const APP_VERSION = '1.2.0';
/* 保存データ（IndexedDB "webclip"）
   clips  : { id, kind, url, canonical, title, site, author, published, excerpt, image,
              text, chars, images, tags[], memo, createdAt, updatedAt, order }
            kind = 'divider' は一覧の仕切り（title が表示文字）。order は手動並べ替えの順（小さいほど上、v1.2）
   bodies : { id, html }   … 本文（サニタイズ済み HTML）。保存した画像は data:image/…;base64 で埋め込む（v1.2）
   バックアップ JSON : { app:'WebClip', format:1, version, exportedAt, clips:[{...clip, html}] } */
const DB_NAME = 'webclip', DB_VER = 1, BACKUP_FORMAT = 1;
const LS_FS = 'webclip.fontSize', LS_BACKUP = 'webclip.lastBackup', LS_SORT = 'webclip.sort';
const KIND_LABEL = { article:'本文', page:'ページ全体', selection:'選択範囲', paste:'貼り付け', link:'リンクのみ', divider:'仕切り' };

/*BM-START*/
/* ブックマークレット本体。表示中のページの中で実行される。
   外部ファイルを読まない・<style> を挿入しない（CSP 対策）・行コメントを書かない（1行化のため）。 */
function WC_BM(APP, VER) {
  var D = document, W = window, B = D.body, old = D.getElementById('__webclip');
  if (old) { old.remove(); return; }
  if (!B) { return; }
  var i, e, s, hid = [], ims = [], all = B.getElementsByTagName('*');
  for (i = 0; i < all.length; i++) {
    e = all[i];
    if (e.tagName === 'NOSCRIPT') { continue; }
    try { s = W.getComputedStyle(e); } catch (x) { continue; }
    if (s && (s.display === 'none' || s.visibility === 'hidden')) { e.setAttribute('data-wch', '1'); hid.push(e); }
  }
  for (i = 0; i < D.images.length; i++) {
    e = D.images[i]; s = e.currentSrc || '';
    if (s && s.indexOf('data:') !== 0) { e.setAttribute('data-wcs', s); ims.push(e); }
  }
  function abs(u) { if (!u) { return ''; } try { return new URL(u, D.baseURI).href; } catch (x) { return ''; } }
  function mt(q) { var m = D.querySelector(q); return m ? (m.getAttribute('content') || '').trim() : ''; }
  function tl(el) { return ((el.innerText || el.textContent) || '').replace(/\s+/g, '').length; }
  function tc(el) { return (el.textContent || '').replace(/\s+/g, '').length; }
  function pick() {
    var c = B.querySelectorAll('p,pre,blockquote,td,div,section,article'), M = new Map(), bx = null, bv = 0, j, k, n, t, v, cm;
    function add(x, y) { if (!x || x === D.documentElement) { return; } M.set(x, (M.get(x) || 0) + y); }
    for (j = 0; j < c.length; j++) {
      n = c[j];
      if (n.closest('[data-wch],nav,footer,aside')) { continue; }
      if (/^(P|PRE|BLOCKQUOTE)$/.test(n.tagName)) {
        t = tc(n); if (t < 20) { continue; }
        cm = ((n.textContent || '').match(/[、，,]/g) || []).length;
        v = 1 + Math.min(t / 80, 4) + Math.min(cm * 0.25, 3);
        add(n.parentElement, v);
        if (n.parentElement) { add(n.parentElement.parentElement, v / 2); if (n.parentElement.parentElement) { add(n.parentElement.parentElement.parentElement, v / 3); } }
      } else {
        t = 0;
        for (k = n.firstChild; k; k = k.nextSibling) { if (k.nodeType === 3) { t += k.nodeValue.replace(/\s+/g, '').length; } }
        if (t < 40) { continue; }
        v = 1 + Math.min(t / 80, 4);
        add(n, v); add(n.parentElement, v / 2);
      }
    }
    var r1 = /article|content|entry|post|body|main|honbun|text|story|blog/i, r2 = /comment|side|footer|nav|menu|related|rank|widget|share|sns|recommend|banner/i;
    M.forEach(function (y, x) {
      var id = (typeof x.className === 'string' ? x.className : '') + ' ' + (x.id || ''), L = tc(x) || 1, al = 0, as = x.getElementsByTagName('a'), q;
      for (q = 0; q < as.length; q++) { al += tc(as[q]); }
      y = y * (1 - Math.min(al / L, 1));
      if (/^(ARTICLE|MAIN)$/.test(x.tagName) || x.getAttribute('itemprop') === 'articleBody') { y *= 1.3; }
      if (r1.test(id)) { y *= 1.15; }
      if (r2.test(id)) { y *= 0.5; }
      if (y > bv) { bv = y; bx = x; }
    });
    if (!bx) { bx = D.querySelector('[itemprop=articleBody],article,main,[role=main]') || B; }
    var L0 = tl(bx), p = bx.parentElement;
    while (p && p !== B && p !== D.documentElement && tl(p) <= L0 * 1.3) { bx = p; p = p.parentElement; }
    var ar = bx.closest('article');
    if (ar && ar !== bx && tl(ar) <= L0 * 2) { bx = ar; }
    return bx;
  }
  function cl(root, junk) {
    var c = root.cloneNode(true), q, j, x, u, L;
    q = c.querySelectorAll('noscript');
    for (j = 0; j < q.length; j++) {
      x = q[j];
      if (/<img/i.test(x.textContent || '')) {
        try {
          var bd = new DOMParser().parseFromString(x.textContent, 'text/html').body, sp = D.createElement('span');
          while (bd.firstChild) { sp.appendChild(D.importNode(bd.firstChild, true)); bd.removeChild(bd.firstChild); }
          x.replaceWith(sp);
        } catch (y) {}
      }
    }
    q = c.querySelectorAll('[data-wch]');
    for (j = 0; j < q.length; j++) { q[j].remove(); }
    q = c.querySelectorAll('iframe');
    for (j = 0; j < q.length; j++) {
      x = q[j]; u = abs(x.getAttribute('src') || '');
      if (/^https?:/.test(u)) { var pa = D.createElement('p'), a = D.createElement('a'); a.href = u; a.textContent = '[埋め込み] ' + u; pa.appendChild(a); x.replaceWith(pa); } else { x.remove(); }
    }
    q = c.querySelectorAll('form');
    for (j = 0; j < q.length; j++) { x = q[j]; while (x.firstChild) { x.parentNode.insertBefore(x.firstChild, x); } x.remove(); }
    q = c.querySelectorAll('script,style,noscript,template,object,embed,input,button,select,textarea,svg,canvas,dialog,link,meta,source' + (junk ? ',nav,aside,footer' : ''));
    for (j = 0; j < q.length; j++) { q[j].remove(); }
    if (junk) {
      L = tc(c) || 1;
      var rj = /(^|[\s_-])(share|sns|social|related|recommend|ranking|comments?|ads?|advert\w*|promo\w*|banner|breadcrumbs?|pagination|pager|subscribe|newsletter|popup|modal|cookie\w*|widget|sidebar|follow)([\s_-]|$)/i;
      q = c.querySelectorAll('*');
      for (j = 0; j < q.length; j++) {
        x = q[j];
        if (rj.test((typeof x.className === 'string' ? x.className : '') + ' ' + (x.id || '')) && tc(x) < L * 0.3) { x.remove(); }
      }
    }
    q = c.querySelectorAll('img');
    for (j = 0; j < q.length; j++) {
      x = q[j];
      var sr = x.getAttribute('src') || '', ss = (x.getAttribute('data-srcset') || x.getAttribute('srcset') || '').trim().split(/[\s,]+/)[0];
      if (/^data:/.test(sr)) { sr = ''; }
      u = x.getAttribute('data-wcs') || x.getAttribute('data-src') || x.getAttribute('data-original') || x.getAttribute('data-lazy-src') || sr || ss || '';
      if (!u || (/^data:/.test(u) && u.length < 400) || x.getAttribute('width') === '1' || x.getAttribute('height') === '1') { x.remove(); continue; }
      x.setAttribute('src', /^data:/.test(u) ? u : abs(u));
      x.removeAttribute('srcset'); x.removeAttribute('sizes'); x.removeAttribute('data-wcs');
    }
    q = c.querySelectorAll('a[href]');
    for (j = 0; j < q.length; j++) {
      x = q[j]; u = x.getAttribute('href') || '';
      if (/^\s*javascript:/i.test(u)) { x.removeAttribute('href'); } else { x.setAttribute('href', abs(u)); }
    }
    return c;
  }
  var se = null, sl = W.getSelection();
  if (sl && sl.rangeCount && !sl.isCollapsed && String(sl).replace(/\s+/g, '').length > 0) {
    var dv = D.createElement('div');
    for (i = 0; i < sl.rangeCount; i++) { dv.appendChild(sl.getRangeAt(i).cloneContents()); }
    se = cl(dv, false);
  }
  var root = pick(), art = cl(root, true), pg = cl(B, false);
  for (i = 0; i < hid.length; i++) { hid[i].removeAttribute('data-wch'); }

/* 貼り付け内容を解釈する。戻り値 { type:'payload'|'html'|'text'|'url'|'error', draft?, url? } */
function interpretPaste(html, text) {
  text = String(text || '');
  const m = text.match(/^\s*WEBCLIP:v1\s*([\s\S]*)$/);
  if (m) {
    try { const p = JSON.parse(m[1]); if (p && p.wc === 1) return { type: 'payload', draft: draftFromPayload(p) }; } catch (e) {}
    return { type: 'error', message: 'ブックマークレットのデータを読み取れませんでした（途中で切れている可能性があります）' };
  }
  const t = text.trim();
  if (isHttpUrl(t) && !/<(p|div|article|h\d|li|table|img)\b/i.test(html || '')) return { type: 'url', url: t };
  if (html && html.trim()) {
    const d = buildDraft({ kind: 'paste', html });
    if (d.html) return { type: 'html', draft: d };
  }
  if (!t) return { type: 'error', message: '貼り付ける内容がありません' };
  const h = t.split(/\n{2,}/).map(p => '<p>' + escHtml(p).replace(/\n/g, '<br>') + '</p>').join('');
  return { type: 'text', draft: buildDraft({ kind: 'paste', html: h }) };
}

/* ---------- 書き出し ---------- */
function clipToMarkdown(c, html) {
  const q = s => JSON.stringify(String(s || ''));
  const fm = ['---', 'title: ' + q(c.title)];
  if (c.url) fm.push('source: ' + q(c.url));
  if (c.site) fm.push('site: ' + q(c.site));
  if (c.author) fm.push('author: ' + q(c.author));
  if (c.published) fm.push('published: ' + q(c.published));
  fm.push('clipped: ' + q(c.createdAt));
  if (c.tags && c.tags.length) fm.push('tags: [' + c.tags.map(q).join(', ') + ']');
  fm.push('---');
  let md = fm.join('\n') + '\n\n# ' + mdEsc(c.title || '無題') + '\n\n';
  if (c.url) md += '元ページ: [' + mdEsc(c.site || hostOf(c.url) || c.url) + '](' + mdUrl(c.url) + ')\n\n';
  if (c.memo) md += c.memo.split('\n').map(l => '> ' + l).join('\n') + '\n\n';
  let body = html ? htmlToMarkdown(html) : (c.excerpt ? mdEsc(c.excerpt) : '');
  const first = body.match(/^# (.*)\n*/);
  if (first && first[1].replace(/\\/g, '').replace(/\s+/g, '') === String(c.title || '').replace(/\s+/g, '')) body = body.slice(first[0].length);
  return md + body + '\n';
}
function clipToHtml(c, html) {
  const meta = [c.site || hostOf(c.url), c.author, c.published ? '公開 ' + fmtDate(c.published, false) : '', '保存 ' + fmtDate(c.createdAt)].filter(Boolean).map(escHtml).join(' · ');
  return '<!DOCTYPE html>\n<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<meta name="referrer" content="no-referrer"><title>' + escHtml(c.title) + '</title><style>' +
    'body{max-width:800px;margin:0 auto;padding:20px;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.85;color:#1d2430;overflow-wrap:anywhere}' +
    'img{max-width:100%;height:auto}pre{overflow:auto;background:#f6f8fa;padding:10px}table{border-collapse:collapse}td,th{border:1px solid #d9dee6;padding:4px 8px}' +
    'blockquote{border-left:3px solid #cbd5e1;margin:1em 0;padding:0 1em;color:#475569}.meta{color:#5d6b7e;font-size:13px}.memo{background:#fff3dc;padding:8px 10px;border-radius:6px;white-space:pre-wrap}' +
    '</style></head><body>\n<h1>' + escHtml(c.title) + '</h1>\n<p class="meta">' + meta + '<br>' +
    (c.url ? '<a href="' + escHtml(c.url) + '">' + escHtml(c.url) + '</a>' : '') + '</p>\n' +
    (c.memo ? '<div class="memo">' + escHtml(c.memo) + '</div>\n' : '') + '<hr>\n' +
    (html ? sanitizeHtml(html, isHttpUrl(c.url) ? c.url : undefined) : '<p>' + escHtml(c.excerpt || '（リンクのみ）') + '</p>') + '\n</body></html>\n';
}
function linksMarkdown(list) {
  const groups = new Map();
  for (const c of list) { const k = siteKey(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
  let md = '# WebClip リンク一覧（' + fmtDate(new Date().toISOString()) + ' 書き出し・' + list.length + '件）\n';
  for (const k of Array.from(groups.keys()).sort()) {
    md += '\n## ' + k + '\n\n';
    for (const c of groups.get(k)) {
      const tags = (c.tags || []).map(t => '#' + t.replace(/\s+/g, '_')).join(' ');
      md += '- ' + (c.url ? '[' + mdEsc(c.title || c.url) + '](' + mdUrl(c.url) + ')' : mdEsc(c.title)) + ' — ' + fmtDate(c.createdAt, false) + (tags ? ' ' + tags : '') + '\n';
    }
  }
  return md;
}
function siteKey(c) { return hostOf(c.url) || '(URLなし)'; }

/* 共有メニュー（Web Share Target）で受け取った内容 → 下書き。何もなければ null。
   Android の Chrome は URL を text に入れて送ることが多い。選択文字を共有すると「文字列 + URL（#:~:text=…）」になる。 */
function draftFromShare(title, text, url) {
  title = String(title || '').trim(); text = String(text || '').trim(); url = String(url || '').trim();
  if (!isHttpUrl(url)) {
    url = '';
    const m = text.match(/https?:\/\/[^\s<>"]+/);
    if (m) { url = m[0]; text = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim(); }
  } else if (text === url) text = '';
  url = url.replace(/#:~:text=.*$/, '');
  if (text && text !== title) {
    const html = text.split(/\n{2,}/).map(p => '<p>' + escHtml(p).replace(/\n/g, '<br>') + '</p>').join('');
    return buildDraft({ kind: 'paste', url, title, html });
  }
  if (!url) return null;
  return buildDraft({ kind: 'link', url, title });
}

/* ---------- 画像の保存（data URL として本文に埋め込む） ---------- */
function imageStats(html) {
  const imgs = Array.from(parseBody(html).querySelectorAll('img'));
  const saved = imgs.filter(i => /^data:/.test(i.getAttribute('src') || '')).length;
  return { total: imgs.length, saved, remote: imgs.length - saved };
}
function blobToDataUrl(bl) { return new Promise(res => { const f = new FileReader(); f.onload = () => res(String(f.result || '')); f.onerror = () => res(''); f.readAsDataURL(bl); }); }
/* 300KB 以下の png/jpeg/gif/webp はそのまま。それ以外は長辺 1600px 以内の JPEG（品質 0.85）にする */
async function shrinkImage(bl) {
  if (bl.size <= 300000 && /^image\/(png|jpeg|gif|webp)$/.test(bl.type)) return blobToDataUrl(bl);
  const bm = await createImageBitmap(bl);
  const s = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bm.width * s)); c.height = Math.max(1, Math.round(bm.height * s));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bm, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
async function fetchImageData(u) {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch(u, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctl.signal });
    clearTimeout(t);
    if (!r.ok) return '';
    const d = await shrinkImage(await r.blob());
    return /^data:image\/(png|jpeg|gif|webp);base64,/.test(d) ? d : '';
  } catch (e) { return ''; }
}
/* 本文中の URL 参照の画像をアプリから取得して埋め込む。他サイトの画像は、そのサイトが CORS を許可している場合だけ取れる */
async function embedImages(html, onProgress) {
  const b = parseBody(html);
  const imgs = Array.from(b.querySelectorAll('img')).filter(i => /^https?:/.test(i.getAttribute('src') || ''));
  const urls = Array.from(new Set(imgs.map(i => i.getAttribute('src'))));
  const got = new Map(); let done = 0;
  await Promise.all(urls.map(async u => { got.set(u, await fetchImageData(u)); done++; if (onProgress) onProgress(done, urls.length); }));
  for (const i of imgs) { const d = got.get(i.getAttribute('src')); if (d) i.setAttribute('src', d); }
  return { html: b.innerHTML, ok: Array.from(got.values()).filter(Boolean).length, total: urls.length };
}
function fmtBytes(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }

/* ---------- 汎用 ---------- */
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch])); }
function fmtDate(iso, withTime = true) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return String(iso || '');
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + (withTime ? ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : '');
}
function parseTags(s) { return Array.from(new Set(String(s || '').split(/[,\s、，]+/).map(t => t.replace(/^#/, '').trim()).filter(Boolean))); }
function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
/*CORE-END*/

/* ---------- 保存領域（IndexedDB、使えない場合はメモリ） ---------- */
let db = null, memMode = false;
const mem = { clips: new Map(), bodies: new Map() };
function idbOpen() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('clips')) d.createObjectStore('clips', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('bodies')) d.createObjectStore('bodies', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function txDone(t) { return new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort')); }); }
function dbGetAll() { return memMode ? Promise.resolve(Array.from(mem.clips.values())) : reqP(db.transaction('clips').objectStore('clips').getAll()); }
async function dbGetBody(id) {
  if (memMode) return mem.bodies.get(id) || '';
  const r = await reqP(db.transaction('bodies').objectStore('bodies').get(id));
  return r ? r.html : '';
}
function dbPutMany(items) {   // items: [{ meta, html }]
  if (memMode) { for (const it of items) { mem.clips.set(it.meta.id, it.meta); mem.bodies.set(it.meta.id, it.html || ''); } return Promise.resolve(); }
  const t = db.transaction(['clips', 'bodies'], 'readwrite');
  for (const it of items) { t.objectStore('clips').put(it.meta); t.objectStore('bodies').put({ id: it.meta.id, html: it.html || '' }); }
  return txDone(t);
}
function dbPutMeta(meta) {
  if (memMode) { mem.clips.set(meta.id, meta); return Promise.resolve(); }
  const t = db.transaction('clips', 'readwrite'); t.objectStore('clips').put(meta); return txDone(t);
}
function dbPutMetaMany(metas) {
  if (!metas.length) return Promise.resolve();
  if (memMode) { for (const m of metas) mem.clips.set(m.id, m); return Promise.resolve(); }
  const t = db.transaction('clips', 'readwrite');
  for (const m of metas) t.objectStore('clips').put(m);
  return txDone(t);
}
function dbDelete(id) {
  if (memMode) { mem.clips.delete(id); mem.bodies.delete(id); return Promise.resolve(); }
  const t = db.transaction(['clips', 'bodies'], 'readwrite');
  t.objectStore('clips').delete(id); t.objectStore('bodies').delete(id);
  return txDone(t);
}

/* ---------- 状態 ---------- */
let clips = [], currentId = null, pending = null, pushedReader = false, persistAsked = false;
const hayCache = new WeakMap();
const $ = s => document.querySelector(s);
const META_KEYS = ['id','kind','url','canonical','title','site','author','published','excerpt','image','text','chars','images','tags','memo','createdAt','updatedAt','order'];
function pickMeta(o) { const m = {}; for (const k of META_KEYS) m[k] = o[k]; m.tags = Array.isArray(m.tags) ? m.tags : []; m.memo = m.memo || ''; return m; }
const isDivider = c => c.kind === 'divider';
function realClips() { return clips.filter(c => !isDivider(c)); }
function hasOrder(c) { return typeof c.order === 'number' && isFinite(c.order); }
function topOrder() { const o = clips.filter(hasOrder).map(c => c.order); return o.length ? Math.min(...o) - 1 : 0; }
/* order が無い記事（v1.1 以前のデータ・古いバックアップ）に、保存日の新しい順で番号を付ける */
async function ensureOrder() {
  const miss = clips.filter(c => !hasOrder(c));
  if (!miss.length) return;
  let base = clips.filter(hasOrder).reduce((m, c) => Math.max(m, c.order), -1) + 1;
  miss.sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
  for (const c of miss) c.order = base++;
  try { await dbPutMetaMany(miss.map(pickMeta)); } catch (e) {}
}
function allTags() {
  const m = new Map();
  for (const c of realClips()) for (const t of c.tags || []) m.set(t, (m.get(t) || 0) + 1);
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
}

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); try { ta.setSelectionRange(0, t.length); } catch (e) {}
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function safeName(s) { return String(s || 'clip').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'clip'; }
function isNarrow() { return window.matchMedia('(max-width: 899px)').matches; }
function findDup(url, canonical, exceptId) {
  const keys = [url, canonical].filter(isHttpUrl).map(normUrl);
  if (!keys.length) return null;
  return clips.find(c => c.id !== exceptId && [c.url, c.canonical].filter(isHttpUrl).map(normUrl).some(k => keys.includes(k))) || null;
}

/* ---------- モーダル ---------- */
function openModal(html) { $('#modal').onclick = null; $('#modal').innerHTML = html; $('#modalWrap').hidden = false; $('#modalWrap').scrollTop = 0; return $('#modal'); }
function closeModal() { $('#modalWrap').hidden = true; $('#modal').innerHTML = ''; pending = null; }
function choose(message, buttons) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = '<p style="white-space:pre-wrap;line-height:1.6;margin:0 0 6px">' + escHtml(message) + '</p><div class="modalBtns">' +
      buttons.map((b, i) => '<button data-i="' + i + '" class="' + (b.cls || '') + '">' + escHtml(b.label) + '</button>').join('') + '</div>';
    $('#dlgWrap').hidden = false;
    d.querySelectorAll('button').forEach(b => b.onclick = () => { $('#dlgWrap').hidden = true; res(buttons[+b.dataset.i].v); });
  });
}

function askText(message, initial, okLabel) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = '<p style="white-space:pre-wrap;line-height:1.6;margin:0 0 6px">' + escHtml(message) + '</p><input type="text" id="askIn">' +
      '<div class="modalBtns"><button data-v="0">キャンセル</button><button data-v="1" class="primary">' + escHtml(okLabel || 'OK') + '</button></div>';
    const inp = d.querySelector('#askIn'); inp.value = initial || '';
    $('#dlgWrap').hidden = false; setTimeout(() => { inp.focus(); inp.select(); }, 30);
    const fin = v => { $('#dlgWrap').hidden = true; res(v); };
    d.querySelectorAll('button').forEach(b => b.onclick = () => fin(b.dataset.v === '1' ? inp.value : null));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); fin(inp.value); } });
  });
}

/* ---------- タグ入力（チップ＋過去のタグから選択） ---------- */
function mountTagEditor(box, initial, idPrefix) {
  let tags = Array.from(new Set(initial || []));
  const all = allTags();
  box.innerHTML = '<div class="tagEd"><div class="tagSel"></div>' +
    '<div class="fldRow"><input type="text" id="' + idPrefix + 'TagIn" placeholder="タグを入力して Enter（候補から選んでも可）" enterkeyhint="done" autocomplete="off">' +
    '<button type="button" class="sm" data-add="1">追加</button></div><div class="tagSug"></div></div>';
  const sel = box.querySelector('.tagSel'), inp = box.querySelector('input'), sug = box.querySelector('.tagSug');
  function render() {
    sel.innerHTML = tags.length ? tags.map(t => '<span class="tagChip">#' + escHtml(t) + '<button type="button" data-rm="' + escHtml(t) + '" title="外す">×</button></span>').join('')
      : '<span class="note">タグなし</span>';
    const q = inp.value.trim().replace(/^#/, '').toLowerCase();
    const cand = all.filter(([t]) => !tags.includes(t) && (!q || t.toLowerCase().includes(q))).slice(0, 40);
    const nw = parseTags(inp.value).filter(t => !tags.includes(t) && !all.some(([x]) => x === t));
    sug.innerHTML = (nw.length ? '<button type="button" class="tagOpt new" data-new="1">＋ 新しいタグ「' + escHtml(nw.join(' ')) + '」</button>' : '') +
      cand.map(([t, n]) => '<button type="button" class="tagOpt" data-tag="' + escHtml(t) + '">#' + escHtml(t) + ' <small>' + n + '</small></button>').join('') ||
      (all.length ? '' : '<span class="note">過去のタグはまだありません。入力して Enter で追加します。</span>');
  }
  function add(list) { for (const t of list) if (!tags.includes(t)) tags.push(t); inp.value = ''; render(); }
  box.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { tags = tags.filter(t => t !== rm.dataset.rm); render(); return; }
    const o = e.target.closest('.tagOpt');
    if (o) { add(o.dataset.new ? parseTags(inp.value) : [o.dataset.tag]); return; }
    if (e.target.closest('[data-add]')) add(parseTags(inp.value));
  });
  inp.addEventListener('input', render);
  inp.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;   // 日本語変換中の Enter は無視
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(parseTags(inp.value)); }
    else if (e.key === 'Backspace' && !inp.value && tags.length) { tags.pop(); render(); }
  });
  render();
  return { get: () => Array.from(new Set([...tags, ...parseTags(inp.value)])) };
}

/* ---------- タグ管理（全記事の名前変更・統合・削除） ---------- */
async function updateTags(match, fn) {
  const changed = [], now = new Date().toISOString();
  clips = clips.map(c => {
    if (isDivider(c) || !match(c)) return c;
    const nc = pickMeta(Object.assign({}, c, { tags: Array.from(new Set(fn(c.tags || []))), updatedAt: now }));
    changed.push(nc); return nc;
  });
  await dbPutMetaMany(changed);
  renderTagFilter(); renderList();
  if (currentId && clips.some(c => c.id === currentId)) openClip(currentId, false);
  return changed.length;
}
function openTagManager() {
  const tg = allTags();
  const m = openModal('<h2>タグ管理</h2>' +
    '<p class="note">名前を変えると、そのタグが付いたすべての記事が変わります。既にあるタグと同じ名前にすると、2つのタグを1つにまとめます。</p>' +
    (tg.length ? '<table class="tagTbl">' + tg.map(([t, n]) => '<tr><td class="tn">#' + escHtml(t) + '</td><td class="n">' + n + '件</td><td class="b">' +
      '<button class="sm" data-ren="' + escHtml(t) + '">名前を変更</button><button class="sm danger" data-del="' + escHtml(t) + '">削除</button></td></tr>').join('') + '</table>'
      : '<p class="note">タグはまだありません。</p>') +
    '<div class="modalBtns"><button id="tmClose">閉じる</button></div>');
  m.querySelector('#tmClose').onclick = closeModal;
  m.onclick = async e => {
    const r = e.target.closest('[data-ren]'), d = e.target.closest('[data-del]');
    if (r) {
      const old = r.dataset.ren;
      const v = await askText('タグ「' + old + '」の新しい名前', old, '変更');
      if (v == null) return;
      const nt = parseTags(v)[0];
      if (!nt || nt === old) return;
      const merge = tg.some(([t]) => t === nt);
      const n = await updateTags(c => c.tags.includes(old), ts => ts.map(t => t === old ? nt : t));
      if ($('#fTag').value === old) { $('#fTag').value = nt; renderList(); }
      toast((merge ? '「' + nt + '」にまとめました' : '名前を変更しました') + '（' + n + '件）');
      openTagManager();
    } else if (d) {
      const old = d.dataset.del;
      const ok = await choose('タグ「' + old + '」をすべての記事から外します。記事は削除されません。', [{ v: false, label: 'キャンセル' }, { v: true, label: '削除', cls: 'primary' }]);
      if (!ok) return;
      const n = await updateTags(c => c.tags.includes(old), ts => ts.filter(t => t !== old));
      toast('タグを外しました（' + n + '件）');
      openTagManager();
    }
  };
}

/* ---------- 仕切り ---------- */
function openDivider(c) {
  const m = openModal('<h2>' + (c ? '仕切りの編集' : '仕切りの追加') + '</h2>' +
    '<label class="fld"><span>表示する文字（空欄なら線だけ）</span><input type="text" id="dvText" placeholder="例：構造設計の資料"></label>' +
    (c ? '' : '<p class="note">一覧のいちばん上に追加します。左のつまみ（⋮⋮）をドラッグして好きな位置へ動かしてください。</p>') +
    '<div class="modalBtns">' + (c ? '<button id="dvDel" class="danger" style="margin-right:auto">削除</button>' : '') +
    '<button id="dvCancel">キャンセル</button><button id="dvSave" class="primary">保存</button></div>');
  const inp = m.querySelector('#dvText'); inp.value = c ? c.title : '';
  setTimeout(() => inp.focus(), 30);
  const save = async () => {
    const now = new Date().toISOString();
    const meta = c ? pickMeta(Object.assign({}, c, { title: inp.value.trim(), updatedAt: now }))
      : pickMeta({ id: uid(), kind: 'divider', title: inp.value.trim(), url: '', text: '', chars: 0, images: 0, tags: [], memo: '', createdAt: now, updatedAt: now, order: topOrder() });
    await dbPutMany([{ meta, html: '' }]);
    clips = clips.filter(x => x.id !== meta.id).concat([meta]);
    closeModal(); renderList();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); save(); } });
  m.querySelector('#dvSave').onclick = save;
  m.querySelector('#dvCancel').onclick = closeModal;
  if (c) m.querySelector('#dvDel').onclick = async () => {
    const ok = await choose('この仕切りを削除します。記事は削除されません。', [{ v: false, label: 'キャンセル' }, { v: true, label: '削除', cls: 'primary' }]);
    if (!ok) return;
    await dbDelete(c.id); clips = clips.filter(x => x.id !== c.id); closeModal(); renderList();
  };
}

/* ---------- 一覧 ---------- */
function hay(c) {
  let h = hayCache.get(c);
  if (!h) { h = [c.title, c.url, c.site, c.memo, (c.tags || []).join(' '), c.author, c.text].join('\n').toLowerCase(); hayCache.set(c, h); }
  return h;
}
function isFiltering() { return !!($('#q').value.trim() || $('#fSite').value || $('#fTag').value); }
function isDragMode() { return $('#fSort').value === 'manual' && !isFiltering(); }
/* withDividers：手動並べ替えで絞り込みなしのときに仕切りも返す */
function filteredClips(withDividers = true) {
  const toks = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const site = $('#fSite').value, tag = $('#fTag').value;
  const a = clips.filter(c => {
    if (isDivider(c)) return false;
    if (site && siteKey(c) !== site) return false;
    if (tag && !(c.tags || []).includes(tag)) return false;
    for (const t of toks) {
      if (t.startsWith('#') && t.length > 1) { if (!(c.tags || []).some(g => g.toLowerCase() === t.slice(1))) return false; }
      else if (!hay(c).includes(t)) return false;
    }
    return true;
  });
  const s = $('#fSort').value;
  const cmpTitle = (x, y) => String(x.title).localeCompare(String(y.title), 'ja');
  const cmpOrder = (x, y) => ((hasOrder(x) ? x.order : 0) - (hasOrder(y) ? y.order : 0)) || String(y.createdAt).localeCompare(String(x.createdAt));
  if (s === 'manual') return (withDividers && !isFiltering() ? clips.slice() : a).sort(cmpOrder);
  if (s === 'old') a.sort((x, y) => String(x.createdAt).localeCompare(String(y.createdAt)));
  else if (s === 'title') a.sort(cmpTitle);
  else if (s === 'site') a.sort((x, y) => siteKey(x).localeCompare(siteKey(y)) || String(y.createdAt).localeCompare(String(x.createdAt)));
  else a.sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
  return a;
}
function renderSites() {
  const sel = $('#fSite'), cur = sel.value, cnt = new Map();
  for (const c of realClips()) { const k = siteKey(c); cnt.set(k, (cnt.get(k) || 0) + 1); }
  const keys = Array.from(cnt.keys()).sort();
  sel.innerHTML = '<option value="">すべてのサイト（' + realClips().length + '）</option>' +
    keys.map(k => '<option value="' + escHtml(k) + '">' + escHtml(k) + '（' + cnt.get(k) + '）</option>').join('');
  sel.value = keys.includes(cur) ? cur : '';
}
function renderTagFilter() {
  const sel = $('#fTag'), cur = sel.value, tg = allTags();
  sel.innerHTML = '<option value="">すべてのタグ</option>' + tg.map(([t, n]) => '<option value="' + escHtml(t) + '">#' + escHtml(t) + '（' + n + '）</option>').join('');
  sel.value = tg.some(([t]) => t === cur) ? cur : '';
}
function renderList() {
  const a = filteredClips(), total = realClips().length, n = a.filter(c => !isDivider(c)).length;
  const manual = $('#fSort').value === 'manual', drag = isDragMode();
  $('#count').textContent = (n === total ? total + ' 件' : n + ' / ' + total + ' 件') + (manual && !drag ? '（絞り込み中は並べ替え・仕切りを表示しません）' : '');
  $('#btnDivider').hidden = !manual;
  $('#btnDivider').disabled = !drag;
  $('#list').classList.toggle('dragMode', drag);
  const handle = drag ? '<span class="handle" title="ドラッグで並べ替え">⋮⋮</span>' : '';
  $('#list').innerHTML = a.map(c => {
    if (isDivider(c)) return '<li data-id="' + c.id + '" class="divider">' + handle + '<span class="dvT">' + escHtml(c.title) + '</span></li>';
    const meta = [escHtml(c.site || siteKey(c)), fmtDate(c.createdAt, false), c.kind === 'link' ? '' : '約' + (c.chars || 0).toLocaleString() + '字'].filter(Boolean).join(' · ');
    return '<li data-id="' + c.id + '" class="' + (c.id === currentId ? 'on' : '') + '">' + handle +
      '<div class="t">' + (c.kind === 'link' ? '<span class="kind link">リンク</span>' : '') + escHtml(c.title) + '</div>' +
      '<div class="m">' + meta + '</div>' +
      ((c.tags || []).length ? '<div class="tg">' + c.tags.map(t => '<span class="tag" data-tag="' + escHtml(t) + '">#' + escHtml(t) + '</span>').join('') + '</div>' : '') +
      (isHttpUrl(c.url) ? '<a class="ext" href="' + escHtml(c.url) + '" target="_blank" rel="noopener noreferrer" title="元ページを開く">↗</a>' : '') +

    '<div class="tagRow">' + (c.tags || []).map(t => '<span class="tag" data-tag="' + escHtml(t) + '">#' + escHtml(t) + '</span>').join('') +

    (c.memo ? '<div class="memo">' + escHtml(c.memo) + '</div>' : '') +
    '<div class="actRow">' + (ist.remote ? '<button data-act="embed">画像を端末に保存（' + ist.remote + '枚）</button>' : '') + '<button data-act="edit">編集</button><button data-act="copymd">Markdownをコピー</button><button data-act="md">.md 保存</button><button data-act="html">.html 保存</button><button data-act="del" class="danger">削除</button></div>' +
    '<div class="fsRow">文字サイズ <button class="sm" data-act="fs-">A−</button><button class="sm" data-act="fs+">A＋</button></div>' +

async function readerAction(act) {
  const c = clips.find(x => x.id === currentId);

  if (act === 'copyurl') { toast(await copyText(c.url) ? 'リンクをコピーしました' : 'コピーできませんでした'); return; }
  if (act === 'copymdlink') { toast(await copyText('[' + mdEsc(c.title) + '](' + mdUrl(c.url) + ')') ? 'Markdown リンクをコピーしました' : 'コピーできませんでした'); return; }
  if (act === 'fs-' || act === 'fs+') { setFs(getFs() + (act === 'fs+' ? 1 : -1)); return; }
  if (act === 'edit') { openEdit(c); return; }
  if (act === 'del') {
    const ok = await choose('「' + c.title + '」を削除します。元に戻せません。', [{ v: false, label: 'キャンセル' }, { v: true, label: '削除', cls: 'primary' }]);
    if (!ok) return;
    await dbDelete(c.id);
    clips = clips.filter(x => x.id !== c.id);
    currentId = null; renderSites(); renderTagFilter(); renderList(); renderWelcome();
    if (isNarrow()) closeReader();
    toast('削除しました'); return;
  }
  const html = await dbGetBody(c.id);
  if (act === 'embed') {
    toast('画像を取得しています…', 60000);
    const r = await embedImages(html, (d, n) => toast('画像を取得しています… ' + d + '/' + n, 60000));
    if (r.ok) {
      const meta = pickMeta(Object.assign({}, c, { images: imageStats(r.html).total, updatedAt: new Date().toISOString() }));
      try { await dbPutMany([{ meta, html: r.html }]); } catch (e) { toast('保存できませんでした：' + (e && e.message || e), 5000); return; }
      clips = clips.map(x => x.id === c.id ? meta : x);
      openClip(c.id, false);
    }
    toast(r.ok + ' / ' + r.total + ' 枚を保存しました' + (r.ok < r.total ? '（残りはサイトの制限で取得できません。ブックマークレットで取り込み直すと取れる場合があります）' : ''), 6000);
    return;
  }
  if (act === 'copymd') { toast(await copyText(clipToMarkdown(c, html)) ? 'Markdown をコピーしました' : 'コピーできませんでした'); return; }
  if (act === 'md') { download(safeName(c.title) + '.md', clipToMarkdown(c, html), 'text/markdown;charset=utf-8'); return; }

}
function getFs() { let v = 16; try { v = parseInt(localStorage.getItem(LS_FS) || '16', 10) || 16; } catch (e) {} return v; }

    '<p class="note">ブックマークレットで「コピー」した内容、または記事ページを全選択してコピーした内容を貼り付けてください。URL だけを貼り付けると「リンクのみ」で保存できます。</p>' +
    '<textarea id="pasteBox" placeholder="ここに貼り付け（Ctrl+V／長押し→ペースト）"></textarea>' +

    '<span class="note">ブラウザが許可を求めることがあります</span></div>' +

  let tm = null;   // キーボードの候補などから入力された場合（paste イベントが来ない場合）
  box.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { const v = box.value; if (v.trim()) { box.value = ''; applyPaste('', v); } }, 400); });
  m.querySelector('#btnReadClip').onclick = readClipboard;
  m.querySelector('#iCancel').onclick = closeModal;
  m.querySelector('#iSave').onclick = savePending;
  if (!isNarrow()) setTimeout(() => { if (!pending && (!document.activeElement || document.activeElement === document.body)) box.focus(); }, 50);
  return m;
}
async function readClipboard() {
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      const items = await navigator.clipboard.read();
      let html = '', text = '';
      for (const it of items) {
        if (it.types.includes('text/html')) html = await (await it.getType('text/html')).text();
        if (it.types.includes('text/plain')) text = await (await it.getType('text/plain')).text();
      }
      applyPaste(html, text); return;
    }
    if (navigator.clipboard && navigator.clipboard.readText) { applyPaste('', await navigator.clipboard.readText()); return; }
  } catch (e) {}
  toast('クリップボードを読み取れませんでした。貼り付け欄に貼り付けてください', 4000);
}
const OLD_BM_MSG = 'ブックマークレットが古い版です。登録し直すと画像も保存できるようになります';

  const r = interpretPaste(html, text);
  if (r.type === 'error') { toast(r.message, 4000); return; }
  if (r.type === 'payload') { const m = String(text).match(/^\s*WEBCLIP:v1\s*([\s\S]*)$/); try { if (oldBookmarklet(JSON.parse(m[1]))) toast(OLD_BM_MSG, 5000); } catch (e) {} }
  if (r.type === 'url') {
    if (pending && pending.kind !== 'link' && !pending.url) { syncPendingFromForm(); if (pending.url) return; pending.url = r.url; pending.site = pending.site || hostOf(r.url); renderPending(); toast('URL を設定しました'); return; }

    pending.title = r.url;
  } else {
    const keepUrl = pending && pending.kind === 'link' && r.type !== 'payload' ? pending.url : '';
    pending = r.draft;
    if (keepUrl && !pending.url) { pending.url = keepUrl; pending.site = hostOf(keepUrl); }
  }
  renderPending();
}

    (d.kind === 'link' ? '' : '<div class="pvBody" id="pvBody"></div>');
  pv.querySelector('#pTitle').value = d.title; pv.querySelector('#pUrl').value = d.url;
  pv.querySelector('#pSite').value = d.site;
  pendingTagEd = mountTagEditor(pv.querySelector('#pTagBox'), d.tags, 'p');
  if (pv.querySelector('#pEmbed')) pv.querySelector('#pEmbed').onclick = async e => {

    const r = await embedImages(d.html, (k, n) => { b.textContent = '取得中… ' + k + '/' + n; });

  }

    const u = pv.querySelector('#pUrl').value.trim();
    d.url = u;
    if (!pv.querySelector('#pSite').value.trim() || pv.querySelector('#pSite').dataset.auto === '1') { pv.querySelector('#pSite').value = hostOf(u); pv.querySelector('#pSite').dataset.auto = '1'; }
    const dup = isHttpUrl(u) ? findDup(u, d.canonical) : null;
    pv.querySelector('#pWarn').innerHTML = (u && !isHttpUrl(u)) ? '<div class="warnBox">URL は http:// か https:// で始まる形で入力してください。</div>'
      : dup ? '<div class="warnBox">同じ URL の記事が保存済みです：「' + escHtml(dup.title) + '」（' + fmtDate(dup.createdAt, false) + '）</div>' : '';
  };
  pv.querySelector('#pUrl').addEventListener('input', onUrl);
  pv.querySelector('#pSite').addEventListener('input', e => { e.target.dataset.auto = '0'; });

  m.querySelector('#iSave').disabled = false;
}
async function savePending() {
  const d = pending, m = $('#modal');
  if (!d) return;
  const url = m.querySelector('#pUrl').value.trim();
  if (url && !isHttpUrl(url)) { toast('URL の形式を確認してください'); return; }
  if (d.kind === 'link' && !url) { toast('リンクのみの保存には URL が必要です'); return; }
  const now = new Date().toISOString();
  let id = uid(), createdAt = now, tags = pendingTagEd ? pendingTagEd.get() : [], memo = m.querySelector('#pMemo').value, order = topOrder();
  const dup = url ? findDup(url, d.canonical) : null;
  if (dup) {
    const ans = await choose('同じ URL の記事が保存されています。\n「' + dup.title + '」（' + fmtDate(dup.createdAt, false) + '）', [
      { v: 'cancel', label: 'キャンセル' }, { v: 'new', label: '別の記事として保存' }, { v: 'over', label: '上書き', cls: 'primary' }]);
    if (ans === 'cancel') return;
    if (ans === 'over') {
      id = dup.id; createdAt = dup.createdAt; if (hasOrder(dup)) order = dup.order;
      tags = Array.from(new Set([...(dup.tags || []), ...tags]));
      memo = memo || dup.memo || '';

  }
  const meta = pickMeta(Object.assign({}, d, {
    id, url, title: m.querySelector('#pTitle').value.trim() || d.title, site: m.querySelector('#pSite').value.trim() || hostOf(url),
    tags, memo, createdAt, updatedAt: now, order, images: imageStats(d.html).total,
  }));
  try { await dbPutMany([{ meta, html: d.html }]); }
  catch (e) { toast('保存できませんでした：' + (e && e.message || e), 5000); return; }
  clips = clips.filter(x => x.id !== id).concat([meta]);
  if (!persistAsked) { persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
  closeModal(); renderSites(); renderTagFilter(); renderList(); openClip(id);
  toast(dup && id === dup.id ? '上書きしました' : '保存しました');
}

/* ---------- ブックマークレット ---------- */
function appUrlForBookmarklet() { return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : ''; }
/* WC_BM 用の簡易圧縮：空白だけを詰める（文字列・正規表現の中は触らない）。
   WC_BM はコメントなし・文は必ず ; で終える前提で書いている。 */
function minifyJs(src) {
  const idc = c => /[A-Za-z0-9_$]/.test(c);
  const reAfterPunct = /^[(,=:\[!&|?{};+\-*%<>~^]$/, reAfterWord = /^(return|typeof|in|of|new|delete|void|throw|case)$/;
  let out = '', i = 0, prev = '', space = false;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { space = true; i++; continue; }
    let j = i + 1;
    if (c === '"' || c === "'") {
      while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
      j++;
    } else if (c === '/' && (prev === '' || reAfterPunct.test(prev) || reAfterWord.test(prev))) {
      let cls = false;
      while (j < n) { const d = src[j]; if (d === '\\') { j += 2; continue; } if (d === '[') cls = true; else if (d === ']') cls = false; else if (d === '/' && !cls) break; j++; }
      j++;
      while (j < n && /[a-z]/i.test(src[j])) j++;
    } else if (idc(c)) {
      while (j < n && idc(src[j])) j++;
    }
    const tok = src.slice(i, j);
    if (space && out && idc(out[out.length - 1]) && idc(tok[0])) out += ' ';
    space = false; out += tok; prev = tok; i = j;
  }
  return out;
}
function bookmarkletCode() {
  return '(' + minifyJs(WC_BM.toString()) + ')(' + JSON.stringify(appUrlForBookmarklet()) + ',' + JSON.stringify(APP_VERSION) + ');void 0';
}
function bookmarkletUrl() { return 'javascript:' + encodeURIComponent(bookmarkletCode()); }
function openBookmarklet() {
  const url = bookmarkletUrl(), app = appUrlForBookmarklet();
  const m = openModal('<h2>ブックマークレット</h2>' +
    '<p class="note">保存したいページで実行すると、本文を抜き出す小さなパネルが出ます。「本文／全体／選択」を切り替えて「コピー」し、WebClip の「取込」に貼り付けます。</p>' +
    '<p style="margin:10px 0"><a class="bmLink" id="bmLink">WebClip</a>　<span class="note">← PC はこれをブックマークバーへドラッグ</span></p>' +
    '<div class="fldRow" style="align-items:center;flex-wrap:wrap"><button id="bmCopy" class="primary">コードをコピー</button><span class="note">' + Math.round(url.length / 1024 * 10) / 10 + ' KB（v' + APP_VERSION + '）</span></div>' +
    (app ? '<div class="infoBox">「アプリへ送る」ボタンが使えます。送り先：' + escHtml(app) + '<br>アプリの URL が変わったら、ブックマークレットを登録し直してください。</div>'
         : '<div class="warnBox">このアプリをファイル（file://）で開いているため、「アプリへ送る」は使えません。「コピー」→「取込」に貼り付けで取り込んでください。GitHub Pages などの https で開くと「アプリへ送る」も使えます。</div>') +
    '<h3>登録のしかた</h3>' +
    '<b style="font-size:13px">PC（Chrome・Edge）</b><ol class="steps"><li>上の「WebClip」ボタンをブックマークバーへドラッグします。</li><li>保存したいページでブックマークをクリックします。</li></ol>' +
    '<b style="font-size:13px">iPad（Safari）</b><ol class="steps"><li>「コードをコピー」を押します。</li><li>適当なページを開き、共有ボタン→「ブックマークを追加」で保存します。</li><li>ブックマーク一覧でそのブックマークを「編集」し、名前を「WebClip」に、アドレスを消してコピーしたコードを貼り付けます。</li><li>保存したいページで、ブックマーク一覧から「WebClip」を選びます。</li></ol>' +
    '<b style="font-size:13px">Android（Chrome）</b><ol class="steps"><li>「コードをコピー」を押します。</li><li>適当なページで☆をタップしてブックマークを作り、「編集」で名前を「WebClip」に、URL をコピーしたコードに置き換えます。</li><li>保存したいページで、アドレスバーに「WebClip」と入力し、候補に出たブックマーク（★の付いたもの）をタップします。</li></ol>' +
    '<p class="note">サイトによっては（セキュリティ設定が厳しい場合など）動かないことがあります。そのときは、ページを全選択してコピーし、「取込」に貼り付けてください。</p>' +
    '<details style="margin-top:8px"><summary class="note" style="cursor:pointer">コードを表示</summary><textarea id="bmCode" rows="5" readonly style="font-family:monospace;font-size:11px"></textarea></details>' +
    '<div class="modalBtns"><button id="bmClose">閉じる</button></div>');
  m.querySelector('#bmLink').setAttribute('href', url);
  m.querySelector('#bmLink').addEventListener('click', e => { e.preventDefault(); toast('ブックマークバーへドラッグして登録してください'); });
  m.querySelector('#bmCode').value = url;
  m.querySelector('#bmCopy').onclick = async () => toast(await copyText(url) ? 'コードをコピーしました' : 'コピーできませんでした。「コードを表示」から選択してコピーしてください', 3500);
  m.querySelector('#bmClose').onclick = closeModal;

/* ---------- バックアップ ---------- */
function getLastBackup() { try { return localStorage.getItem(LS_BACKUP) || ''; } catch (e) { return ''; } }
async function openBackup() {
  let est = '';
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); est = (e.usage / 1048576).toFixed(1) + ' MB 使用'; } } catch (e) {}
  let persisted = '';
  try { if (navigator.storage && navigator.storage.persisted) persisted = (await navigator.storage.persisted()) ? '保護あり' : '保護なし（ブラウザが容量不足時などに削除する可能性あり）'; } catch (e) {}
  const lb = getLastBackup();
  const m = openModal('<h2>バックアップ</h2>' +
    '<div class="kv"><b>保存件数</b>' + realClips().length + ' 件<br><b>最終書き出し</b>' + (lb ? fmtDate(lb) : 'まだありません') +
    (est ? '<br><b>使用容量</b>' + est : '') + (persisted ? '<br><b>保存領域</b>' + persisted : '') + (memMode ? '<br><b>注意</b><span style="color:var(--ng)">保存領域が使えないため、画面を閉じると消えます</span>' : '') + '</div>' +
    '<h3>全件</h3><div class="fldRow" style="flex-wrap:wrap"><button id="bExport" class="primary">JSON 書き出し</button><button id="bImport">JSON 読み込み</button></div>' +
    '<p class="note">読み込みは追加・統合です。同じ記事（同じ ID）は更新日時が新しいほうを残します。</p>' +
    '<h3>リンク一覧</h3><div class="fldRow" style="flex-wrap:wrap"><button id="bLinksMd">.md で保存</button><button id="bLinksCopy">コピー</button></div>' +
    '<p class="note">一覧で絞り込んでいる場合は、表示中の記事だけを書き出します（' + filteredClips(false).length + ' 件）。サイトごとにまとめた Markdown です。</p>' +
    '<p class="note">iPad・iPhone の Safari では、ホーム画面に追加していないサイトのデータが、しばらく使わないと消えることがあります。定期的な書き出しをおすすめします。</p>' +
    '<div class="modalBtns"><button id="bClose">閉じる</button></div>');
  m.querySelector('#bExport').onclick = exportJson;
  m.querySelector('#bImport').onclick = () => $('#fileIn').click();
  m.querySelector('#bLinksMd').onclick = () => download('WebClip_links_' + new Date().toISOString().slice(0, 10) + '.md', linksMarkdown(filteredClips(false)), 'text/markdown;charset=utf-8');
  m.querySelector('#bLinksCopy').onclick = async () => toast(await copyText(linksMarkdown(filteredClips(false))) ? 'リンク一覧をコピーしました' : 'コピーできませんでした');
  m.querySelector('#bClose').onclick = closeModal;
}
async function exportJson() {
  const out = [];
  for (const c of clips) out.push(Object.assign(pickMeta(c), { html: await dbGetBody(c.id) }));
  const data = { app: 'WebClip', format: BACKUP_FORMAT, version: APP_VERSION, exportedAt: new Date().toISOString(), clips: out };
  const d = new Date(), p = n => String(n).padStart(2, '0');
  download('WebClip_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.json', JSON.stringify(data, null, 1), 'application/json');
  try { localStorage.setItem(LS_BACKUP, data.exportedAt); } catch (e) {}
  toast(out.filter(c => !isDivider(c)).length + ' 件を書き出しました');
  if (!$('#modalWrap').hidden && $('#bExport')) openBackup();
}
async function importJson(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('JSON を読み込めませんでした', 4000); return; }
  if (!data || data.app !== 'WebClip' || !Array.isArray(data.clips)) { toast('WebClip のバックアップ形式ではありません', 4000); return; }
  if (data.format > BACKUP_FORMAT) { toast('新しい版のバックアップです。アプリを更新してください', 4000); return; }
  const byId = new Map(clips.map(c => [c.id, c]));
  const items = []; let add = 0, upd = 0, skip = 0;
  for (const raw of data.clips) {
    if (!raw || typeof raw !== 'object' || !raw.id) { skip++; continue; }
    const url = String(raw.url || '');
    const html = sanitizeHtml(String(raw.html || ''), isHttpUrl(url) ? url : undefined);
    const meta = pickMeta(Object.assign({}, raw));
    meta.id = String(raw.id); meta.kind = KIND_LABEL[meta.kind] ? meta.kind : 'paste';
    meta.title = String(meta.title || url || '無題'); meta.url = url;
    meta.createdAt = meta.createdAt || new Date().toISOString(); meta.updatedAt = meta.updatedAt || meta.createdAt;
    meta.tags = Array.isArray(raw.tags) ? raw.tags.map(String) : [];
    if (meta.order != null && !(typeof meta.order === 'number' && isFinite(meta.order))) delete meta.order;
    if (meta.kind === 'divider') { meta.url = ''; meta.title = String(raw.title || ''); }
    if (typeof meta.text !== 'string') { meta.text = htmlToText(html); meta.chars = meta.text.replace(/\s/g, '').length; }
    const ex = byId.get(meta.id);
    if (ex && String(ex.updatedAt) >= String(meta.updatedAt)) { skip++; continue; }
    ex ? upd++ : add++;
    items.push({ meta, html }); byId.set(meta.id, meta);
  }
  try { await dbPutMany(items); } catch (e) { toast('読み込みに失敗しました：' + (e && e.message || e), 5000); return; }
  clips = Array.from(byId.values());
  await ensureOrder();
  renderSites(); renderTagFilter(); renderList();
  closeModal();
  toast('追加 ' + add + ' 件・更新 ' + upd + ' 件・変更なし ' + skip + ' 件', 4000);
}

/* ---------- ブックマークレットからの受信 ---------- */
const receivedIds = new Set();
let ready = null;
window.addEventListener('message', async e => {
  const m = e.data;
  if (!m || m.webclip !== 1 || !m.id || !m.data || m.data.wc !== 1) return;
  try { e.source && e.source.postMessage({ webclipAck: m.id }, e.origin && e.origin !== 'null' ? e.origin : '*'); } catch (x) {}
  if (receivedIds.has(m.id)) return;
  receivedIds.add(m.id);
  await ready;
  closeModal();
  openImport();
  pending = draftFromPayload(m.data);
  renderPending();
  toast(oldBookmarklet(m.data) ? OLD_BM_MSG : 'ブックマークレットから受け取りました。確認して保存してください', 5000);
});

/* ---------- イベント ---------- */
$('#btnImport').onclick = () => openImport();
$('#btnBm').onclick = openBookmarklet;
$('#btnBackup').onclick = openBackup;
$('#btnBack').onclick = closeReader;
$('#fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJson(f); };
$('#q').addEventListener('input', renderList);
$('#fSite').addEventListener('change', renderList);
$('#fTag').addEventListener('change', renderList);
$('#fSort').addEventListener('change', () => { try { localStorage.setItem(LS_SORT, $('#fSort').value); } catch (e) {} renderList(); });
$('#btnDivider').onclick = () => openDivider(null);
$('#btnTags').onclick = openTagManager;
$('#list').addEventListener('click', e => {
  if (e.target.closest('a.ext') || e.target.closest('.handle')) return;
  const dv = e.target.closest('li.divider');
  if (dv) { const c = clips.find(x => x.id === dv.dataset.id); if (c) openDivider(c); return; }
  const tg = e.target.closest('.tag');

});
$('#reader').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { readerAction(b.dataset.act); return; }
  const tg = e.target.closest('.tag');

});
window.addEventListener('popstate', () => { if (pushedReader || document.body.classList.contains('reading')) { pushedReader = false; document.body.classList.remove('reading'); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#dlgWrap').hidden) return;
  if (!$('#modalWrap').hidden) closeModal();
});
document.addEventListener('paste', e => {   // 一覧画面で Ctrl+V したときも取込として扱う
  if (!$('#modalWrap').hidden) return;
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  const cd = e.clipboardData; if (!cd) return;

/* ---------- ドラッグで並べ替え（手動・絞り込みなしのとき） ---------- */
let drag = null;
$('#list').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const li = h.closest('li');
  e.preventDefault();
  const r = li.getBoundingClientRect();
  const ph = document.createElement('li'); ph.className = 'ph'; ph.style.height = r.height + 'px';
  li.after(ph);
  Object.assign(li.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', zIndex: 40 });
  li.classList.add('dragging');
  drag = { li, ph, dy: e.clientY - r.top, y: e.clientY, pid: e.pointerId, timer: setInterval(dragAutoScroll, 30) };
  try { h.setPointerCapture(e.pointerId); } catch (x) {}
});
function dragPlace() {
  const list = $('#list'); let before = null;
  for (const el of list.children) {
    if (el === drag.li || el === drag.ph) continue;
    const r = el.getBoundingClientRect();
    if (drag.y < r.top + r.height / 2) { before = el; break; }
  }
  if (before) { if (drag.ph.nextSibling !== before) list.insertBefore(drag.ph, before); }
  else if (list.lastElementChild !== drag.ph) list.appendChild(drag.ph);
}
function dragAutoScroll() {
  if (!drag) return;
  const p = $('#listPane'), r = p.getBoundingClientRect(), top = r.top + $('.listTools').offsetHeight;
  const d = drag.y < top + 40 ? -12 : drag.y > r.bottom - 40 ? 12 : 0;
  if (d) { p.scrollTop += d; dragPlace(); }
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.y = e.clientY; drag.li.style.top = (e.clientY - drag.dy) + 'px';
  dragPlace();
}, { passive: false });
async function dragEnd(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const { li, ph, timer } = drag; drag = null; clearInterval(timer);
  li.removeAttribute('style'); li.classList.remove('dragging'); ph.replaceWith(li);
  const ids = Array.from($('#list').children).map(x => x.dataset.id).filter(Boolean);
  const byId = new Map(clips.map(c => [c.id, c])), changed = [];
  ids.forEach((id, i) => { const c = byId.get(id); if (c && c.order !== i) { const nc = pickMeta(Object.assign({}, c, { order: i })); changed.push(nc); byId.set(id, nc); } });
  if (changed.length) {
    clips = clips.map(c => byId.get(c.id) || c);
    try { await dbPutMetaMany(changed); } catch (x) { toast('並べ替えを保存できませんでした'); }
  }
  renderList();
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);

/* ---------- 起動 ---------- */
ready = (async function init() {
  $('#ver').textContent = 'v' + APP_VERSION;
  setFs(getFs());
  try { db = await idbOpen(); } catch (e) { memMode = true; toast('この環境では保存領域を使えません。データは画面を閉じると消えます', 6000); }
  try { clips = (await dbGetAll()).map(pickMeta); } catch (e) { clips = []; }
  await ensureOrder();
  try { const so = localStorage.getItem(LS_SORT); if (so && Array.from($('#fSort').options).some(o => o.value === so)) $('#fSort').value = so; } catch (e) {}
  renderSites(); renderTagFilter(); renderList(); renderWelcome();
  if (location.hash === '#receive') {
    history.replaceState(null, '', location.pathname + location.search);
    if (!receivedIds.size) toast('ブックマークレットからの受信を待っています…', 3000);
  }
  const sp = new URLSearchParams(location.search);
  if (sp.has('url') || sp.has('text') || sp.has('title')) {   // 共有メニューから起動された
    history.replaceState(null, '', location.pathname);
    const d = draftFromShare(sp.get('title'), sp.get('text'), sp.get('url'));
    if (d) { openImport(); pending = d; renderPending(); toast('共有メニューから受け取りました。確認して保存してください', 3500); }
  }
})();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
